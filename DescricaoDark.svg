<text x="390" y="30" fill="#c9d1d9">
<tspan x="15" y="30">About Me</tspan> ———————————————————————————————————————————————————————
  <tspan x="30" y="70" class="value">
    I'm someone who has always been really interested in technology and how things work. I really enjoy learning new things, creating
  </tspan>
  <tspan x="30" y="90" class="value">
    projects and experimenting with different technologies. 
  </tspan>

  <tspan x="30" y="120" class="value">
    I'm currently studying Software Engineering, and during the course I've been able to work with different areas of development, but
  </tspan>


  <tspan x="30" y="140" class="value">
    front-end is definitely the area I enjoy the most.
  </tspan>

  <tspan x="30" y="180" class="value">
    I like creating interfaces, seeing the result of what I'm building and turning ideas into something that actually works.
  </tspan>

  <tspan x="30" y="220" class="value">
    I'm still learning a lot and trying new things every day, and my goal is to keep improving my skills and eventually work with  
  </tspan>

  <tspan x="30" y="240" class="value">
    something I genuinely enjoy.
  </tspan>
</text>
