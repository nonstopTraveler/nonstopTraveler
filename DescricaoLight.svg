<text x="390" y="30" fill="#24292f">
<tspan x="15" y="30">About Me</tspan> ———————————————————————————————————————————————————————————————————————————————————————————

<tspan x="30" y="70" class="value">
  I've always been interested in technology and understanding how things work.
</tspan>

<tspan x="30" y="90" class="value">
  I enjoy learning new things, creating projects, and experimenting with different technologies.
</tspan>

<tspan x="30" y="120" class="value">
  I'm currently studying Software Engineering, where I've had the opportunity
</tspan>

<tspan x="30" y="140" class="value">
  to explore different areas of development, with front-end development
</tspan>

<tspan x="30" y="160" class="value">
  being the area I enjoy the most.
</tspan>

<tspan x="30" y="180" class="value">
  I enjoy creating interfaces, seeing my ideas come to life, and turning
</tspan>

<tspan x="30" y="200" class="value">
  concepts into something that actually works.
</tspan>

<tspan x="30" y="220" class="value">
  I'm constantly learning, experimenting, and improving my skills, with the
</tspan>

<tspan x="30" y="240" class="value">
  goal of building a career in an area that I'm genuinely passionate about.
</tspan>
  
</text>
